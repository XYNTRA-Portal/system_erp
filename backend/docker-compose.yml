services:

  postgres:
    image: postgres:17
    container_name: erp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/postgres_data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d erp" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: erp-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: erp-backend

    environment:
      APP_NAME: ERP
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/erp
      ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/erp
      API_V1_PREFIX: /api/v1
      SECRET_KEY: 8f4c2a7d9e1b6c3f5a0e2d8b7c4f9a1e6d3b8c5a2f7e0d4b9c6a1f8e3d5b7c
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    ports:
      - "8000:8000"

    volumes:
      - ./app:/app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data: